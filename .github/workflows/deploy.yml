name: Deploy mirage-crawl

# Manual deploy of the HTTP sensor. Anyone with write access to this repo can run it, so the SSH key behind it is
# restricted to deploy/deploy.sh, which accepts only a 40-hex commit SHA (server setup: deploy/DEPLOY.md).
#
# What it does: tests the chosen commit, then asks the server to check out exactly that SHA and rebuild the containers.
# Rollback is the same workflow with an older ref. It never touches the data volumes or .env on the server.
#
# Every deploy changes what the sensor shows or records, so it is a research-era boundary: add a planned entry to
# mirage-lab ledger/CHANGES.md first and tick the box below.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy (default main). Use an older SHA to roll back.
        default: main
        required: true
      ledger_ack:
        description: I added a planned entry for this deploy to mirage-lab ledger/CHANGES.md
        type: boolean
        required: true

concurrency:
  group: deploy-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Require the ledger acknowledgement
        if: ${{ !inputs.ledger_ack }}
        run: |
          echo "Tick ledger_ack after adding the planned entry to mirage-lab ledger/CHANGES.md" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit checks
        run: python tests/test_units.py
      - name: End-to-end checks
        run: python tests/test_e2e.py
      - name: Deploy script checks
        run: python tests/test_deploy.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ${{ needs.test.outputs.sha }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CRAWL_DEPLOY_HOST }}
          port: ${{ secrets.CRAWL_DEPLOY_PORT }}
          username: ${{ secrets.CRAWL_DEPLOY_USER }}
          key: ${{ secrets.CRAWL_DEPLOY_KEY }}
          script: /opt/mirage/mirage-crawl/deploy/deploy.sh ${{ needs.test.outputs.sha }}
      - name: Ledger row for mirage-lab
        env:
          SHA: ${{ needs.test.outputs.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Paste into mirage-lab ledger/CHANGES.md (fill in the actual UTC time in the Actual column)"
            echo
            echo "| Planned UTC | Actual UTC | Sensor | Change | Git SHA | By | Experiment / era |"
            echo "|---|---|---|---|---|---|---|"
            echo "| | $(date -u +'%Y-%m-%d %H:%M:%S') | mirage-crawl | deploy | ${SHA:0:7} | ${ACTOR} | |"
          } >> "$GITHUB_STEP_SUMMARY"
